<script>
(() => {
const tl = gsap.timeline({ paused: true });
const T = {"pdf": 2.539, "eight": 5.572, "cola": 7.771, "fields": 9.4, "nothing": 12.408, "confirm": 15.541, "pan": 12.208, "verified": 15.841000000000001, "sfx_select": 2.839, "sfx_review": 10.35, "sfx_tap": 15.541, "sfx_success": 16.041};
const DUR = 19;

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const fadeIn = (sel, t, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
const fadeOut = (sel, t, d = 0.4) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: d, ease: "power1.in", immediateRender: false }, t);
// force3D keeps moved elements composited for their whole life: no end-of-move re-raster or pixel snap
const rise = (sel, t, o = {}) => tl.fromTo(sel, { opacity: 0, y: o.y ?? 18 }, { opacity: 1, y: 0, duration: o.d ?? 0.6, ease: "power3.out", stagger: o.s ?? 0, force3D: true }, t);
const pop = (sel, t, d = 0.45) => tl.fromTo(sel, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.7)", force3D: true }, t);
const count = (el, from, to, t, d, fmt) => {
  const o = { v: from };
  el.textContent = fmt(from);
  tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t);
};
// SVG path reveal: draws `frac` of each matching path
const draw = (sel, t, d = 0.8, frac = 1, ease = "power2.inOut") => $$(sel).forEach((p) => {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L + " " + L;
  tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
  tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: L * (1 - frac), duration: d, ease }, t);
});
// the one camera move: a single scale-and-position tween, then a complete hold
const camTo = (sel, v, t, d = 1.3) => tl.to(sel, { ...v, duration: d, ease: "power2.inOut", force3D: true }, t);
// Scripted cursor: travel to (x, y), press at t, optional ripple.
const click = (cur, rip, x0, y0, x, y, t) => {
  tl.fromTo(cur, { opacity: 0, x: x0, y: y0 }, { opacity: 1, duration: 0.25 }, t - 1.2);
  tl.to(cur, { x, y, duration: 0.9, ease: "power2.inOut" }, t - 1.0);
  tl.to(cur, { scale: 0.86, duration: 0.08, ease: "power1.in" }, t);
  tl.to(cur, { scale: 1, duration: 0.18, ease: "power2.out" }, t + 0.08);
  if (rip) tl.fromTo(rip, { opacity: 0.5, scale: 0.2, x: x - 30, y: y - 30 }, { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.out" }, t);
};

fadeIn("#s05-intake-scene", 0, 0.5);
fadeOut("#s05-intake-scene", DUR - 0.4, 0.4);

rise("#s05-intake-pdf", T.pdf, { y: 30 });
tl.fromTo("#s05-intake-br", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, T.pdf + 0.3);
gsap.set("#s05-intake-br-cam", { x: -347.20, y: -240.80, scale: 1.0000 });
tl.fromTo("#s05-intake-hl1", { backgroundColor: "rgba(253,240,236,0)", boxShadow: "inset 0 -2px 0 rgba(232,106,74,0)" }, { backgroundColor: "rgba(253,240,236,1)", boxShadow: "inset 0 -2px 0 rgba(232,106,74,1)", duration: 0.4 }, T.eight);
tl.fromTo("#s05-intake-hl2", { backgroundColor: "rgba(253,240,236,0)", boxShadow: "inset 0 -2px 0 rgba(232,106,74,0)" }, { backgroundColor: "rgba(253,240,236,1)", boxShadow: "inset 0 -2px 0 rgba(232,106,74,1)", duration: 0.4 }, T.cola);
// AI extraction: each value lifts off the PDF and lands on the real field it fills
rise("#s05-intake-q1", T.fields - 0.3);
[[-834, -13], [-694, -38], [-1088, -13], [-1221, -68]].forEach(([dx, dy], i) => {
  const t = T.fields + i * 0.22, s = "#s05-intake-f" + i;
  gsap.set(s, { xPercent: -50, yPercent: -50 });
  tl.fromTo(s, { opacity: 0, x: dx, y: dy, scale: 0.9 }, { opacity: 1, duration: 0.2 }, t);
  tl.to(s, { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power3.inOut" }, t);
  tl.to(s, { opacity: 0, scale: 0.85, duration: 0.3, ease: "power1.in" }, t + 1.0);
  tl.fromTo("#s05-intake-r" + i, { opacity: 0 }, { opacity: 1, duration: 0.25 }, t + 0.95);
});
// the person reviews: guardrail lines excluded, one pan down to Confirm, the click
tl.to("#s05-intake-q1", { opacity: 0, duration: 0.3 }, T.nothing - 0.5);
rise("#s05-intake-q2", T.nothing - 0.2);
tl.fromTo("#s05-intake-i2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.pan - 0.2);
tl.to("#s05-intake-scene .ember-ring", { opacity: 0, duration: 0.3 }, T.pan - 0.2);
camTo("#s05-intake-br-cam", { x: -492.80, y: -716.80, scale: 1.0000 }, T.pan, 1.2);
tl.fromTo("#s05-intake-rc", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.pan + 1.2);
click("#s05-intake-cur", "#s05-intake-rip", 1500, 900, 1716, 680, T.confirm);
tl.to("#s05-intake-cur", { opacity: 0, duration: 0.25 }, T.confirm + 0.3);
tl.to("#s05-intake-rc", { opacity: 0, duration: 0.2 }, T.confirm + 0.2);
// the page changes to its verified state (a navigation, so a quick dip rather than a camera move)
tl.to("#s05-intake-blank", { opacity: 1, duration: 0.15 }, T.verified);
tl.set("#s05-intake-br-cam", { x: -347.20, y: -67.20, scale: 1.0000 }, T.verified + 0.16);
tl.set("#s05-intake-i3", { opacity: 1 }, T.verified + 0.16);
tl.set(["#s05-intake-i1", "#s05-intake-i2"], { opacity: 0 }, T.verified + 0.16);
tl.to("#s05-intake-blank", { opacity: 0, duration: 0.3 }, T.verified + 0.2);
tl.fromTo("#s05-intake-rv", { opacity: 0 }, { opacity: 1, duration: 0.35 }, T.verified + 0.6);
tl.to("#s05-intake-q2", { opacity: 0, duration: 0.3 }, T.verified);
rise("#s05-intake-q3", T.verified + 0.3);
fadeIn("#s05-intake-legend", 0.6);

window.__timelines["s05-intake"] = tl;
})();
</script>
