<script>
(() => {
const tl = gsap.timeline({ paused: true });
const T = {"head": 0.35, "stock": 0.3, "over": 2.566, "price": 6.353, "erodes": 9.16, "out": 10.2};
const DUR = 11;

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const fadeIn = (sel, t, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
const fadeOut = (sel, t, d = 0.4) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: d, ease: "power1.in", immediateRender: false }, t);
// force3D keeps moved elements composited for their whole life: no end-of-move re-raster or pixel snap
const rise = (sel, t, o = {}) => tl.fromTo(sel, { opacity: 0, y: o.y ?? 18 }, { opacity: 1, y: 0, duration: o.d ?? 0.6, ease: "power3.out", stagger: o.s ?? 0, force3D: true }, t);
const pop = (sel, t, d = 0.45) => tl.fromTo(sel, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.7)", force3D: true }, t);
const count = (el, from, to, t, d, fmt) => {
  const o = { v: from };
  el.textContent = fmt(from);
  tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t);
};
// SVG path reveal: draws `frac` of each matching path
const draw = (sel, t, d = 0.8, frac = 1, ease = "power2.inOut") => $$(sel).forEach((p) => {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L + " " + L;
  tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
  tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: L * (1 - frac), duration: d, ease }, t);
});
// the one camera move: a single scale-and-position tween, then a complete hold
const camTo = (sel, v, t, d = 1.3) => tl.to(sel, { ...v, duration: d, ease: "power2.inOut", force3D: true }, t);
// Scripted cursor: travel to (x, y), press at t, optional ripple.
const click = (cur, rip, x0, y0, x, y, t) => {
  tl.fromTo(cur, { opacity: 0, x: x0, y: y0 }, { opacity: 1, duration: 0.25 }, t - 1.2);
  tl.to(cur, { x, y, duration: 0.9, ease: "power2.inOut" }, t - 1.0);
  tl.to(cur, { scale: 0.86, duration: 0.08, ease: "power1.in" }, t);
  tl.to(cur, { scale: 1, duration: 0.18, ease: "power2.out" }, t + 0.08);
  if (rip) tl.fromTo(rip, { opacity: 0.5, scale: 0.2, x: x - 30, y: y - 30 }, { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.out" }, t);
};




// S02's timeline clears; its truck travels into the stockout panel
tl.to(["#s03-stakes-tint", "#s03-stakes-redseg", "#s03-stakes-axis", "#s03-stakes-ticks", "#s03-stakes-tleb", "#s03-stakes-tlab", "#s03-stakes-plus"], { opacity: 0, duration: 0.4 }, 0);
tl.fromTo("#s03-stakes-truck", { x: 1260, y: 734, scale: 1.25 }, { x: 492, y: 514, scale: 1, duration: 1.0, ease: "power2.inOut" }, 0.15);
rise("#s03-stakes-head", T.head);
fadeIn("#s03-stakes-sample", 0.8);
// panel 1: coverage runs out before the truck
fadeIn(["#s03-stakes-c1 .eyebrow", "#s03-stakes-c2 .eyebrow", "#s03-stakes-c3 .eyebrow"], 0.5, 0.4);
fadeIn(["#s03-stakes-v1 path", "#s03-stakes-v1 line", "#s03-stakes-v1 text:not(#s03-stakes-covt)"], 0.7, 0.5);
tl.fromTo("#s03-stakes-cov", { scaleX: 0, svgOrigin: "140 463" }, { scaleX: 1, duration: 0.8, ease: "power2.out", svgOrigin: "140 463" }, T.stock - 0.3);
fadeIn("#s03-stakes-covt", T.stock + 0.3, 0.3);
tl.fromTo("#s03-stakes-gap", { opacity: 0, scaleX: 0, svgOrigin: "391 470" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out", svgOrigin: "391 470" }, T.stock + 0.4);
rise(["#s03-stakes-c1 .fig", "#s03-stakes-c1 .desc"], T.stock + 0.5, { s: 0.1 });
// panel 2: cartons stack up and lock the cash
tl.fromTo("#s03-stakes-v2 .ct", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05, ease: "power2.out" }, T.over - 0.4);
pop("#s03-stakes-lock", T.over + 0.3);
rise(["#s03-stakes-c2 .fig", "#s03-stakes-c2 .desc"], T.over + 0.3, { s: 0.1 });
count($("#s03-stakes-n2"), 0, 42775, T.over + 0.3, 1.0, (v) => "$" + Math.round(v).toLocaleString("en-US"));
// panel 3: the cost tag moves and the margin bar pays for it
rise("#s03-stakes-v3", T.price - 0.4);
gsap.set("#s03-stakes-c136", { opacity: 0, y: 14 });
gsap.set("#s03-stakes-up", { opacity: 0 });
tl.to("#s03-stakes-c128", { opacity: 0, y: -14, duration: 0.3 }, T.price + 0.5);
tl.to("#s03-stakes-c136", { opacity: 1, y: 0, duration: 0.3 }, T.price + 0.6);
tl.to("#s03-stakes-up", { opacity: 1, duration: 0.3 }, T.price + 0.8);
tl.to("#s03-stakes-cost", { width: 239.4, duration: 0.8, ease: "power2.inOut" }, T.price + 0.7);
tl.to("#s03-stakes-marg", { width: 200.6, duration: 0.8, ease: "power2.inOut" }, T.price + 0.7);
rise(["#s03-stakes-c3 .fig", "#s03-stakes-c3 .desc"], T.price + 0.6, { s: 0.1 });
count($("#s03-stakes-n3"), 1.22, 1.14, T.erodes, 0.8, (v) => "$" + v.toFixed(2));
// collapse into the three data inputs StockPulse reads (S04 picks them up)
