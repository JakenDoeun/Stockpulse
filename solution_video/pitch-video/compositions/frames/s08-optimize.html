<script>
(() => {
const tl = gsap.timeline({ paused: true });
const T = {"head": 0.3, "t1": 6.565, "t2": 7.551, "t3": 8.537, "t4": 9.928, "t5": 10.528, "res": 10.954, "cut": 12.37, "covered": 13.761, "lower": 15.382, "b": 11.569999999999999, "click": 13.27, "sfx_tap": 13.27};
const DUR = 23;

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const fadeIn = (sel, t, d = 0.5) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
const fadeOut = (sel, t, d = 0.4) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: d, ease: "power1.in", immediateRender: false }, t);
// force3D keeps moved elements composited for their whole life: no end-of-move re-raster or pixel snap
const rise = (sel, t, o = {}) => tl.fromTo(sel, { opacity: 0, y: o.y ?? 18 }, { opacity: 1, y: 0, duration: o.d ?? 0.6, ease: "power3.out", stagger: o.s ?? 0, force3D: true }, t);
const pop = (sel, t, d = 0.45) => tl.fromTo(sel, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.7)", force3D: true }, t);
const count = (el, from, to, t, d, fmt) => {
  const o = { v: from };
  el.textContent = fmt(from);
  tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t);
};
// SVG path reveal: draws `frac` of each matching path
const draw = (sel, t, d = 0.8, frac = 1, ease = "power2.inOut") => $$(sel).forEach((p) => {
  const L = p.getTotalLength();
  p.style.strokeDasharray = L + " " + L;
  tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
  tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: L * (1 - frac), duration: d, ease }, t);
});
// the one camera move: a single scale-and-position tween, then a complete hold
const camTo = (sel, v, t, d = 1.3) => tl.to(sel, { ...v, duration: d, ease: "power2.inOut", force3D: true }, t);
// Scripted cursor: travel to (x, y), press at t, optional ripple.
const click = (cur, rip, x0, y0, x, y, t) => {
  tl.fromTo(cur, { opacity: 0, x: x0, y: y0 }, { opacity: 1, duration: 0.25 }, t - 1.2);
  tl.to(cur, { x, y, duration: 0.9, ease: "power2.inOut" }, t - 1.0);
  tl.to(cur, { scale: 0.86, duration: 0.08, ease: "power1.in" }, t);
  tl.to(cur, { scale: 1, duration: 0.18, ease: "power2.out" }, t + 0.08);
  if (rip) tl.fromTo(rip, { opacity: 0.5, scale: 0.2, x: x - 30, y: y - 30 }, { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.out" }, t);
};

fadeIn("#s08-optimize-scene", 0, 0.5);
fadeOut("#s08-optimize-scene", DUR - 0.4, 0.4);

rise("#s08-optimize-head", T.head);
[[1, T.t1], [2, T.t2], [3, T.t3], [4, T.t4], [5, T.t5]].forEach(([i, t]) => {
  rise("#s08-optimize-t" + i, t, { y: 24 });
  if (i > 1) fadeIn("#s08-optimize-o" + (i - 1), t - 0.15, 0.3);
});
fadeIn("#s08-optimize-o5", T.t5 + 0.5, 0.3);
tl.fromTo("#s08-optimize-t6", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, T.t5 + 0.6);
rise("#s08-optimize-res", T.res);
// part B: the budget cut, as a bar and in the real cart
tl.to("#s08-optimize-a", { opacity: 0, duration: 0.4 }, T.b);
fadeIn("#s08-optimize-b", T.b, 0.01);
gsap.set("#s08-optimize-br-cam", { x: -996.00, y: -216.00, scale: 1.0000 });
rise(["#s08-optimize-bh", "#s08-optimize-track", "#s08-optimize-lim", "#s08-optimize-planl"], T.b + 0.1, { s: 0.06, y: 16 });
rise(["#s08-optimize-ln0", "#s08-optimize-ln1", "#s08-optimize-ln2"], T.b + 0.3, { s: 0.08, y: 16 });
tl.fromTo("#s08-optimize-br", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, T.b + 0.2);
click("#s08-optimize-cur", "#s08-optimize-rip", 1300, 820, 997, 368, T.click);
tl.fromTo("#s08-optimize-i2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, T.click + 0.15);
tl.to("#s08-optimize-cur", { opacity: 0, duration: 0.25 }, T.click + 0.35);
// the limit moves: the plan no longer fits, then re-solves under it
tl.to("#s08-optimize-lim", { x: -216.0, duration: 0.9, ease: "power2.inOut" }, T.click + 0.2);
count($("#s08-optimize-limv"), 12000, 8400, T.click + 0.2, 0.9, (v) => "$" + Math.round(v).toLocaleString("en-US"));
tl.to("#s08-optimize-over", { opacity: 0.85, duration: 0.25 }, T.click + 0.9);
tl.to("#s08-optimize-over", { opacity: 0, duration: 0.3 }, T.click + 1.5);
tl.to("#s08-optimize-plan", { width: 501.3, duration: 0.8, ease: "power2.inOut" }, T.click + 1.4);
count($("#s08-optimize-planv"), 9714.28, 8355.02, T.click + 1.4, 0.8, (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
tl.fromTo("#s08-optimize-ra", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.click + 1.4);
tl.to("#s08-optimize-ra", { opacity: 0, duration: 0.3 }, T.covered);
// critical lines hold; lower-priority lines shrink
tl.fromTo("#s08-optimize-ln0 .cs", { boxShadow: "0 0 0 0px rgba(52,120,246,0)" }, { boxShadow: "0 0 0 4px rgba(52,120,246,.3)", duration: 0.3, stagger: 0.08 }, T.covered);
tl.fromTo("#s08-optimize-rb", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.covered);
tl.to("#s08-optimize-rb", { opacity: 0, duration: 0.3 }, T.lower - 0.2);
tl.to("#s08-optimize-qd", { width: 209, duration: 0.8, ease: "power2.inOut" }, T.lower);
tl.to("#s08-optimize-ql", { width: 145, duration: 0.8, ease: "power2.inOut" }, T.lower + 0.15);
tl.fromTo("#s08-optimize-rd", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.lower);
rise("#s08-optimize-note", T.lower + 0.6, { y: 10 });

window.__timelines["s08-optimize"] = tl;
})();
</script>
